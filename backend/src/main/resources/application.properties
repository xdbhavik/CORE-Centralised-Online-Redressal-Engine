spring.application.name=ai-based-graviance-system

# ==========================================================================
# SECRETS POLICY — read before adding a key here
# ==========================================================================
# This file is TRACKED IN GIT and the repo is public, so every credential is a
# ${ENV_VAR:} placeholder with an EMPTY default. Real values live in
# config/application-local.properties (git-ignored) or in the environment.
#
# Never paste a literal key here, even "just for the demo" — one `git commit -a`
# publishes it permanently.
#
# Run with the real values:
#   mvn spring-boot:run "-Dspring-boot.run.profiles=local"
# ==========================================================================

# =====================
# Datasource — local MySQL
# =====================
# createDatabaseIfNotExist keeps a fresh clone from failing on a missing schema.
# Override via DB_URL / DB_USERNAME / DB_PASSWORD (or the standard
# SPRING_DATASOURCE_* env vars used by Docker), so this block only describes the
# local-machine setup.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/grievance_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================
# JPA / Hibernate
# =====================
# ddl-auto=update is what creates the Complaint verification columns and the
# ivr_session / ivr_call_log tables — there is no migration tool in this project.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Init DB scripts (data.sql). defer-datasource-initialization is REQUIRED:
# data.sql inserts into tables Hibernate has not created yet at plain init time.
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.jpa.defer-datasource-initialization=true

# =====================
# JWT
# =====================
# HS256 needs >= 32 bytes of key material; a shorter secret fails at startup.
jwt.secret=${JWT_SECRET:ReplaceThisWithAVeryLongAndSecureSecretKey2024}
# 15 minutes
jwt.accessTokenExpirationMillis=${JWT_ACCESS_TOKEN_EXPIRATION_MILLIS:900000}
# 14 days
jwt.refreshTokenExpirationMillis=${JWT_REFRESH_TOKEN_EXPIRATION_MILLIS:1209600000}

server.port=${SERVER_PORT:8080}

# Public URL of this application (e.g. https://grievance.example.com). Used as the
# HTTP-Referer header when calling the LLM API.
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}

# =====================
# AI Module (NVIDIA NIM)
# =====================
ai.enabled=true
ai.chat.provider=nvidia-nim
ai.chat.base-url=${AI_CHAT_BASE_URL:https://integrate.api.nvidia.com/v1}
ai.chat.api-key=${NVIDIA_API_KEY:}
ai.chat.model=${NVIDIA_MODEL:nvidia/nemotron-nano-8b-instruct}
ai.chat.timeout-millis=30000

# Embeddings
# Dimension MUST match the embedding model's output size
# local-hashing=384 | OpenAI text-embedding-3-small=1536 | Ollama nomic-embed=768
ai.embedding.provider=local-hashing
ai.embedding.model=local-hashing-384
ai.embedding.dimensions=384

# Duplicate detection
ai.duplicate.enabled=true
ai.duplicate.top-k=10
ai.duplicate.threshold=0.82
ai.duplicate.high-confidence=0.90

# =====================
# Sarvam AI — STT / Translation / TTS  (api.sarvam.ai)
# =====================
# NOTE: this is NOT the voice-agent product. See sarvam.voice.* below — separate
# API, separate key, separate billing. Swapping the two keys breaks both halves
# silently, so keep them clearly apart.
ai.sarvam.base-url=${SARVAM_BASE_URL:https://api.sarvam.ai}
ai.sarvam.api-key=${SARVAM_API_KEY:}
ai.sarvam.stt-model=saarika:v2.5
# saaras family: auto-detects the spoken language and returns English in one call
ai.sarvam.stt-translate-model=saaras:v2.5
ai.sarvam.language-code=hi-IN
ai.sarvam.max-audio-size-mb=20
# Text translation model (mayura:v1 | sarvam-translate:v1)
ai.sarvam.translate-model=mayura:v1
# TTS used for inbound IVR prompt audio
ai.sarvam.tts-model=bulbul:v2
ai.sarvam.tts-speaker=anushka

# =====================
# Qdrant Vector Database
# =====================
ai.qdrant.base-url=${QDRANT_URL:http://localhost:6333}
ai.qdrant.api-key=${QDRANT_API_KEY:}

# =====================
# RAG Collections
# Add/remove here — QdrantCollectionInitializer auto-creates them on startup
# =====================
# Minimum cosine score for a retrieved chunk to reach the LLM (noise filter)
rag.min-score=0.25
rag.collections[0]=department_knowledge
rag.collections[1]=category_knowledge
rag.collections[2]=sop_knowledge
rag.collections[3]=complaint_history
rag.collections[4]=faq_knowledge
rag.collections[5]=government_rules

# =====================
# Firebase Phone Auth OTP
# =====================
firebase.enabled=${FIREBASE_ENABLED:true}
firebase.web-api-key=${FIREBASE_WEB_API_KEY:}
firebase.service-account.path=classpath:firebase-service-account.json
# DEV ONLY: accepts idToken="mock-<mobile>" without contacting Firebase.
# NEVER enable in production — it turns auth into a formality.
firebase.dev-mock-enabled=${FIREBASE_DEV_MOCK_ENABLED:true}

# Dev-only mock OTP endpoints (/api/v1/otp/*). Default OFF (prod-safe);
# OtpController is not even registered unless this is true.
app.dev.mock-otp-enabled=${APP_DEV_MOCK_OTP_ENABLED:false}

# =====================
# OTP Configuration
# =====================
otp.expiry-minutes=5
otp.max-attempts=5
otp.resend-cooldown-seconds=60

# =====================
# Spring Boot Actuator
# =====================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =====================
# File Upload / Complaint Media
# =====================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Complaint media storage directory
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# =====================
# SLA Breach Scheduler
# =====================
# Set to false to disable the background SLA scan (integration tests do this).
sla.scheduler.enabled=true
# Scan interval — 15 minutes
sla.scheduler.fixed-rate-ms=900000
# Delay before the first scan so the app can finish booting — 1 minute
sla.scheduler.initial-delay-ms=60000

# =====================
# IVR — citizen call-back verification policy
# =====================
# Ships DISABLED: a fresh clone or CI run must never place a real phone call.
# Enable in the local profile (config/application-local.properties).
ivr.enabled=${IVR_ENABLED:false}
ivr.provider=sarvam
# Sarvam has to reach us on a public URL; in dev this is the ngrok tunnel.
# Without it a call is placed but its result never comes back, and the complaint
# drifts to FAILED after the retries run out.
ivr.base-public-url=${IVR_BASE_PUBLIC_URL:http://localhost:8080}
ivr.max-retries=3
ivr.retry-delay-minutes=30
ivr.recording.max-seconds=60
# Verifies the per-call HMAC token on the post-call webhook. Keep TRUE anywhere
# internet-reachable — the callback URL is public, so without this anyone can
# POST a forged "citizen confirmed" and get a complaint verified.
ivr.validate-signature=${IVR_VALIDATE_SIGNATURE:true}

# Gate: hold departmental ACTION (not reading) until the citizen confirms.
ivr.verification.gate-enabled=true
# Fail-OPEN. If every attempt goes unanswered the complaint proceeds anyway: a
# switched-off phone must never be the reason a real grievance is stranded.
# Only an explicit denial by the citizen blocks it.
ivr.verification.proceed-on-failed=true
ivr.verification.max-attempts=3
ivr.verification.retry-delay-minutes=30

# =====================
# Sarvam AI Voice Agents — outbound calls  (apps.sarvam.ai)
# =====================
# The conversation itself lives in an agent built in the Sarvam dashboard, so
# most of these are opaque ids rather than behaviour knobs. Values go in
# config/application-local.properties.
sarvam.voice.enabled=${SARVAM_VOICE_ENABLED:false}
sarvam.voice.base-url=${SARVAM_VOICE_BASE_URL:https://apps.sarvam.ai}
sarvam.voice.api-key=${SARVAM_VOICE_API_KEY:}
sarvam.voice.org-id=${SARVAM_VOICE_ORG_ID:}
sarvam.voice.workspace-id=${SARVAM_VOICE_WORKSPACE_ID:}
sarvam.voice.app-id=${SARVAM_VOICE_APP_ID:}
# Pinned so a prompt edit in the dashboard cannot silently change what citizens
# hear mid-deployment.
sarvam.voice.app-version=${SARVAM_VOICE_APP_VERSION:1}
sarvam.voice.connection-id=${SARVAM_VOICE_CONNECTION_ID:}
sarvam.voice.agent-phone-number=${SARVAM_VOICE_AGENT_PHONE_NUMBER:}
# Shared secret that proves a post-call webhook really came from our call.
sarvam.voice.webhook-secret=${SARVAM_VOICE_WEBHOOK_SECRET:}
# These three MUST match the agent's configured output variable exactly.
# A mismatch makes every answer read as "unclear", which looks like a dead
# feature rather than a config error.
sarvam.voice.result-variable=${SARVAM_VOICE_RESULT_VARIABLE:verification_result}
sarvam.voice.confirmed-value=${SARVAM_VOICE_CONFIRMED_VALUE:confirmed}
sarvam.voice.denied-value=${SARVAM_VOICE_DENIED_VALUE:denied}

# =====================
# SMS
# =====================
# Disabled by default → messages are logged, not sent. Note that even when
# enabled nothing ships yet: no SMS gateway is wired (Sarvam provides voice
# agents, not SMS).
sms.enabled=${SMS_ENABLED:false}
